name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish single file
        run: >
          dotnet publish MatchScheduler/MatchScheduler.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }} -o out

      - name: Rename asset
        run: Rename-Item out/VolleyballScheduler.exe VolleyballScheduler-win-x64.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/VolleyballScheduler-win-x64.exe
          generate_release_notes: true
